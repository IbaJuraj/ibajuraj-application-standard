name: Apply Standard 1.6.2

on:
  push:
    branches: [main]
    paths:
      - 'Checks/apply-1.6.2.py'
      - '.github/workflows/apply-1.6.2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 1.6.2 patch
        run: python3 Checks/apply-1.6.2.py
      - name: Validate final tree
        run: bash Checks/validate-standard.sh
      - name: Commit final Standard 1.6.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release IbaJuraj Application Standard 1.6.2'
          git push
