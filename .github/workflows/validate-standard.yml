name: Publish IbaJuraj Application Standard 1.6.4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-standard-1-6-4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Standard 1.6.4 metadata schema
        run: python3 .release-1.6.4/schema_patch.py

      - name: Prepare Standard 1.6.4 release tree
        run: python3 .release-1.6.4/upgrade.py

      - name: Validate Standard 1.6.4
        run: bash Checks/validate-standard.sh

      - name: Commit published Standard 1.6.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IbaJuraj Release Bot'
          git config user.email '134379854+IbaJuraj@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release IbaJuraj Application Standard 1.6.4'
          git push origin HEAD:main

      - name: Create standard-v1.6.4 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a standard-v1.6.4 -m 'IbaJuraj Application Standard 1.6.4'
          git push origin standard-v1.6.4
          gh release create standard-v1.6.4 \
            --title 'IbaJuraj Application Standard 1.6.4' \
            --notes-file RELEASE_NOTES_1.6.4.md \
            --latest

# corrected 1.6.4 publication trigger
