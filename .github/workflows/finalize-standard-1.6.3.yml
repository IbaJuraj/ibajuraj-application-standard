name: Finalize IbaJuraj Application Standard 1.6.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-standard-1.6.3.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated 1.6.3 release patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(Release/1.6.3/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo 'No staged patches found.' >&2
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "Checking $patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Remove temporary release staging files
        shell: bash
        run: |
          rm -rf Release/1.6.3
          rm -f .github/workflows/finalize-standard-1.6.3.yml

      - name: Validate Standard 1.6.3
        shell: bash
        run: |
          bash Checks/validate-standard.sh

      - name: Commit finalized release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IbaJuraj Release Bot'
          git config user.email '134379854+IbaJuraj@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize IbaJuraj Application Standard 1.6.3'
          git push origin HEAD:main
